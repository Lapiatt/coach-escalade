<style>
  :root { --bg:#0f172a; --fg:#f8fafc; --muted:#94a3b8; --hang:#16a34a; --rest:#1d4ed8; --warm:#b45309; --btn:#f59e0b; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,system-ui,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
  body { padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); transition:background .3s; }
  body.hang { background:var(--hang); } body.rest { background:var(--rest); } body.warm { background:var(--warm); }
  .screen { display:none; height:100%; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:4vh; }
  .screen.on { display:flex; }
  h1 { font-size:8vw; font-weight:800; }
  .sub { color:var(--muted); font-size:4.5vw; line-height:1.4; max-width:34em; }
  button { font:inherit; border:0; border-radius:24px; cursor:pointer; }
  .big { background:var(--btn); color:#111; font-size:8vw; font-weight:800; padding:6vh 8vw; width:100%; max-width:600px; }
  .small { background:rgba(255,255,255,.18); color:var(--fg); font-size:5vw; font-weight:700; padding:3vh 6vw; flex:1; }
  #label { font-size:9vw; font-weight:800; line-height:1.1; min-height:2.2em; display:flex; align-items:center; }
  #time { font-size:42vw; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
  #count { font-size:7vw; font-weight:700; opacity:.9; }
  #next { font-size:5vw; opacity:.8; min-height:1.4em; }
  .row { display:flex; gap:16px; width:100%; max-width:600px; }
  @media (orientation:landscape) { #time { font-size:30vh; } #label { font-size:8vh; } }
</style>
</head>
<body>
<section id="home" class="screen on">
  <h1>Coach escalade</h1>
  <button class="big" id="start">Séance du jour</button>
  <p class="sub">Force max doigts (D-MAX)<br>Échauffement puis 5 suspensions de 10 s, 2 min de repos.<br>≈ 14 min. Monte le son et coupe le mode silencieux.</p>
</section>
<section id="run" class="screen">
  <div id="count"></div>
  <div id="label"></div>
  <div id="time">0</div>
  <div id="next"></div>
  <div class="row">
    <button class="small" id="pause">Pause</button>
    <button class="small" id="stop">Arrêter</button>
  </div>
</section>
<section id="done" class="screen">
  <h1>Séance terminée</h1>
  <button class="big" id="home-btn">Accueil</button>
</section>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Séance D-MAX — paramètres : voir SOURCES.md (revue §4.3, R1, R7).
// ---------------------------------------------------------------------------
const WARM_CARDIO_S = 120;          // ECH : 2 min cardio léger (§4.3)
const WARM_MOBILITY_S = 60;         // ECH : 1 min mobilité épaules et poignets (§4.3)
const WARM_HANGS = [30, 50, 70];    // ECH : suspensions à ~30, 50, 70 %, pieds au sol (§4.3, R7)
const WARM_HANG_S = 7;              // ECH : 7 s (§4.3, R7)
const WARM_REST_S = 30;             // ECH : 30 s de repos (§4.3, R7)
const MAX_REPS = 5;                 // D-MAX : 5 suspensions (§4.3, R1)
const MAX_HANG_S = 10;              // D-MAX : 10 s (§4.3, R1)
const MAX_REST_S = 120;             // D-MAX : 2 min de repos (§4.3, R1)
// HYPOTHÈSE H3 (SOURCES.md) : la revue demande « prêt », « suspends », « lâche » et un compte
// à rebours (§4.1) sans en fixer les durées. Choix : « prêt » 5 s avant, bips à 3-2-1.
const READY_S = 5;

function buildPlan() {
  const p = [];
  p.push({ kind:'warm', label:'Cardio léger', dur:WARM_CARDIO_S,
           say:'Échauffement. Deux minutes de cardio léger.' });
  p.push({ kind:'warm', label:'Mobilité épaules et poignets', dur:WARM_MOBILITY_S,
           say:'Une minute de mobilité, épaules et poignets.' });
  WARM_HANGS.forEach((pct, i) => {
    p.push({ kind:'hang', label:'Pieds au sol, ' + pct + ' %', dur:WARM_HANG_S,
             count:'Échauffement ' + (i+1) + ' / ' + WARM_HANGS.length,
             say:'Suspends. ' + pct + ' pour cent, pieds au sol.' });
    p.push({ kind:'rest', label:'Repos', dur:WARM_REST_S, say:'Lâche. Repos trente secondes.' });
  });
  for (let i = 1; i <= MAX_REPS; i++) {
    p.push({ kind:'hang', label:'Suspension max', dur:MAX_HANG_S, count:'Suspension ' + i + ' / ' + MAX_REPS,
             say:'Suspends. Série ' + i + ' sur ' + MAX_REPS + '.' });
    if (i < MAX_REPS) p.push({ kind:'rest', label:'Repos', dur:MAX_REST_S, say:'Lâche. Repos deux minutes.' });
  }
  return p;
}

// --- Son -------------------------------------------------------------------
let ctx = null, voice = null;
function initAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  const pick = () => {
    const v = speechSynthesis.getVoices();
    voice = v.find(x => /^fr[-_]FR/i.test(x.lang)) || v.find(x => /^fr/i.test(x.lang)) || null;
  };
  pick(); speechSynthesis.onvoiceschanged = pick;
  say(' ');  // iOS : la voix doit être débloquée par un tapotement
}
function beep(freq, len) {
  if (!ctx) return;
  const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.6, t + 0.01);
  g.gain.setValueAtTime(0.6, t + len - 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + len + 0.02);
}
function say(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR'; if (voice) u.voice = voice; u.rate = 1.0; u.volume = 1;
  speechSynthesis.speak(u);
  window.__said && window.__said.push(text);
}

// --- Écran allumé ------------------------------------------------------------
let lock = null;
async function keepAwake(on) {
  const vid = document.getElementById('nosleep');
  if (on) {
    try { lock = await navigator.wakeLock.request('screen'); } catch (e) { lock = null; }
    if (!lock) { try { await vid.play(); } catch (e) {} }
  } else {
    try { lock && lock.release(); } catch (e) {} lock = null; vid.pause();
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state === 'running') keepAwake(true);
});

// --- Déroulé -------------------------------------------------------------------
const $ = id => document.getElementById(id);
let plan = [], idx = 0, stepStart = 0, pausedAt = 0, state = 'idle', fired = new Set(), timer = null;
const now = () => performance.now();

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function nextText(i) {
  const n = plan[i + 1]; if (!n) return 'Dernière';
  return 'Ensuite : ' + (n.kind === 'hang' ? n.label + ' (' + n.dur + ' s)' : n.label);
}
function enter(i) {
  idx = i; stepStart = now(); fired = new Set();
  const s = plan[i];
  document.body.className = s.kind;
  $('label').textContent = s.label; $('count').textContent = s.count || '';
  $('next').textContent = nextText(i);
  if (s.kind === 'hang') beep(1320, 0.45); else beep(660, 0.3);
  setTimeout(() => say(s.say), s.kind === 'hang' ? 450 : 300);
}
function tick() {
  if (state !== 'running') return;
  const s = plan[idx];
  const el = (now() - stepStart) / 1000;
  const left = s.dur - el;
  const shown = Math.max(0, Math.ceil(left));
  $('time').textContent = shown >= 60 ? Math.floor(shown/60) + ':' + String(shown%60).padStart(2,'0') : shown;
  const next = plan[idx + 1];
  // Avant une suspension : « prêt » puis bips 3-2-1 (hypothèse H3)
  if (next && next.kind === 'hang' && s.dur > READY_S + 1 && left <= READY_S && !fired.has('ready')) {
    fired.add('ready'); say('Prêt.');
  }
  for (const k of [3, 2, 1]) {
    if (left <= k && left > k - 1 && !fired.has(k) && s.dur > k) {
      fired.add(k);
      if (s.kind === 'hang' || (next && next.kind === 'hang')) beep(880, 0.15);
    }
  }
  if (left <= 0) {
    if (idx + 1 < plan.length) enter(idx + 1); else finish();
  }
}
function finish() {
  state = 'idle'; clearInterval(timer); keepAwake(false);
  document.body.className = ''; beep(1320, 0.3); setTimeout(() => beep(1760, 0.6), 350);
  setTimeout(() => say('Lâche. Séance terminée. Bravo.'), 900);
  show('done');
}
$('start').onclick = () => {
  initAudio(); keepAwake(true);
  plan = buildPlan(); state = 'running'; show('run');
  $('pause').textContent = 'Pause';
  enter(0); clearInterval(timer); timer = setInterval(tick, 100); tick();
};
$('pause').onclick = () => {
  if (state === 'running') { state = 'paused'; pausedAt = now(); speechSynthesis.cancel(); $('pause').textContent = 'Reprendre'; say('Pause.'); }
  else if (state === 'paused') { stepStart += now() - pausedAt; state = 'running'; $('pause').textContent = 'Pause'; say('On reprend.'); }
};
$('stop').onclick = () => {
  state = 'idle'; clearInterval(timer); keepAwake(false); speechSynthesis.cancel();
  document.body.className = ''; show('home');
};
$('home-btn').onclick = () => show('home');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
